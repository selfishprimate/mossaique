name: Parse README and Update JSON

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
  pull_request:
    branches:
      - main
    paths:
      - 'README.md'

# Serialise every workflow that auto-commits to main so two runs never race
# each other's push (that race is what produced "! [rejected] (fetch first)").
concurrency:
  group: auto-commit-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # On pull requests: only validate. Never push from a PR run - merging the PR
  # fires the push event below, which is what actually commits the JSON.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate README parses
        run: npm run parse-readme

  parse-and-commit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run README parser
        run: npm run parse-readme

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code src/data/*.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/*.json
          git commit -m "chore: auto-update JSON files from README.md

          🤖 Automatically generated by parse-readme workflow"
          git pull --rebase origin main
          git push origin HEAD:main
