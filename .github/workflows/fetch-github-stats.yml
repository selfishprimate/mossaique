name: Update GitHub Stats

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

# Never let two stats runs push to main at the same time
concurrency:
  group: auto-commit-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Fetch GitHub stats
        # The stargazers endpoint requires authentication (it returns 401 without a
        # token), so the script must run with GITHUB_TOKEN in its environment.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-github-data.js

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code src/data/github-stats.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/github-stats.json
          git commit -m "chore: update GitHub stats

          🤖 Automatically updated by fetch-github-stats workflow"
          git pull --rebase origin main
          git push origin HEAD:main
